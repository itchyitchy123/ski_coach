[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ski-coach"
version = "0.1.0"
description = "Confidence-aware ski technique analysis from video pose landmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
video = ["mediapipe>=0.10,<0.11", "opencv-python-headless>=4.10,<5"]
ui = [
    "mediapipe>=0.10,<0.11",
    "opencv-python-headless>=4.10,<5",
    "streamlit>=1.40,<2",
    "pandas>=2.2,<3",
]
dev = ["pytest>=8,<9"]

[project.scripts]
ski-coach = "ski_coach.cli:main"

[tool.setuptools.packages.find]
include = ["ski_coach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
