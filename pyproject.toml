[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ski-coach"
version = "0.1.0"
description = "Confidence-aware ski technique analysis from video pose landmarks"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["skiing", "computer-vision", "pose-estimation", "sports-analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
video = ["mediapipe>=0.10,<1.1", "opencv-python-headless>=4.10,<5"]
ui = [
    "mediapipe>=0.10,<1.1",
    "opencv-python-headless>=4.10,<5",
    "streamlit>=1.40,<2",
    "pandas>=2.2,<3",
]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.scripts]
ski-coach = "ski_coach.cli:main"

[tool.setuptools.packages.find]
include = ["ski_coach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
